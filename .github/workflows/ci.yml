name: CI

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-features --locked
      - run: python tools/test_native_plugin.py --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: x86_64-unknown-none
      - run: cargo check --lib --no-default-features --target x86_64-unknown-none --locked
      - run: cargo check --lib --all-features --target x86_64-unknown-none --locked
      - run: cargo bench --bench ime --locked
